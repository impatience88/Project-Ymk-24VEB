<ellipse cx="1120" cy="855" rx="180.0" ry="38.0" class="uc"/>
<text x="1120" y="845" class="uct">
<tspan x="1120" dy="0">Отправить email-рассылку о переносе</tspan>
<tspan x="1120" dy="21">или отмене занятий</tspan>
</text>
<rect x="250" y="935" width="1180" height="34" rx="8" fill="#fff8eb" stroke="#e6c58d"/>
<text x="840" y="957" text-anchor="middle" font-size="14" fill="#80551c">Платная запись: заявка клиента → звонок менеджера → оплата → запись на курс.</text>
