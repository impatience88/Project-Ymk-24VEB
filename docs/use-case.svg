<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="990" viewBox="0 0 1680 990">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#243447}.title{font-size:30px;font-weight:700}.uc{fill:#fff;stroke:#245b91;stroke-width:2}.uct{font-size:16px;text-anchor:middle}.assoc{fill:none;stroke:#71869b;stroke-width:2}.actor-label{font-size:17px;font-weight:700;text-anchor:middle}</style>
<text x="840" y="48" text-anchor="middle" class="title">Диаграмма прецедентов школы «Языковой портал»</text>
<rect x="230" y="85" width="1210" height="835" rx="22" fill="#f7faff" stroke="#9bb4cc" stroke-width="2.5"/>
<text x="835" y="123" text-anchor="middle" font-size="21" font-weight="700">Информационная система школы «Языковой портал»</text>

<circle cx="105" cy="445" r="18" fill="#fff" stroke="#245b91" stroke-width="3"/>
<path d="M105 463 L105 520 M76 490 L134 490 M105 520 L81 555 M105 520 L129 555" fill="none" stroke="#245b91" stroke-width="3.5" stroke-linecap="round"/>
<text x="105" y="588" class="actor-label">Клиент / слушатель</text>
<circle cx="1575" cy="445" r="18" fill="#fff" stroke="#b7791f" stroke-width="3"/>
<path d="M1575 463 L1575 520 M1546 490 L1604 490 M1575 520 L1551 555 M1575 520 L1599 555" fill="none" stroke="#b7791f" stroke-width="3.5" stroke-linecap="round"/>
